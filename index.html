<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123a2f" />
    <meta name="description" content="GymMaster — Không gian quản lý hội viên, lịch tập và vận hành phòng tập." />
    <title>GymMaster | Quản lý phòng tập</title>
    <script>
      try {
        const theme = localStorage.getItem('gm-theme')
        document.documentElement.dataset.theme = ['light', 'dark'].includes(theme) ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.lang = localStorage.getItem('gm-language') === 'en' ? 'en' : 'vi'
      } catch { /* Use the default theme when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
